<svg xmlns="http://www.w3.org/2000/svg" width="400" height="237" viewBox="0 0 400 237" role="img" aria-label="EGOS-2000, extended: Replaced the scheduler in a RISC-V teaching OS with a 5-level preemptive MLFQ, with aging, a priority boost for keyboard input and per-process stats. Wrote grep and wc -l on raw syscalls.">
<title>EGOS-2000, extended</title>
