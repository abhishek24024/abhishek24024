<text x="28" y="72" font-size="20" fill="#E8EAF0" font-weight="600" letter-spacing="-0.4">EGOS-2000, extended</text>
<text x="28" y="96" font-size="10" fill="#8E9CFF" font-weight="500" letter-spacing="1.4">C · RISC-V · QEMU</text>
<rect x="28" y="110" width="344" height="1" fill="#262A36"/>
<text x="28" y="136" font-size="12" fill="#B2B7C3">Replaced the scheduler in a RISC-V teaching OS</text>
<text x="28" y="155" font-size="12" fill="#B2B7C3">with a 5-level preemptive MLFQ, with aging, a</text>
<text x="28" y="174" font-size="12" fill="#B2B7C3">priority boost for keyboard input and</text>
